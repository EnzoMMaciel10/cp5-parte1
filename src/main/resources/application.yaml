spring:
  application:
    name: cp5

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cp5}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
